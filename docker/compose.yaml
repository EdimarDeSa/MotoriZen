
volumes:
  db_data:
  keycloak_data:
  keycloak_conf:
  redis_data:

networks:
  postgres_network:
    driver: bridge
  keycloak_network:
    driver: bridge
  redis_network:
    driver: bridge


services:
  postgres:
    container_name: motorizen_db
    image: postgres:16
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_sql:/docker-entrypoint-initdb.d/
    networks:
      - postgres_network
    hostname: motorizen_db
    shm_size: 128mb

  keycloak:
    container_name: motorizen_keycloak
    image: quay.io/keycloak/keycloak:25.0.6
    env_file:
      - ../.env
    volumes:
      - keycloak_data:/opt/keycloak/data
      - keycloak_conf:/opt/keycloak/conf
    command: ["start-dev"]
    ports:
      - "8080:8080"
    networks:
      - keycloak_network
    hostname: motorizen_keycloak
    shm_size: 256mb

  redis:
    container_name: motorizen_redis
    image: motorizen:redis
    env_file:
      - redis_config/redis.env
    user: "redis:redis"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis_network
    shm_size: 128mb
    hostname: motorizen_redis

  motorizen_api:
    container_name: motorizen_api
    image: motorizen:api
    env_file:
      - api_config/api.env
    networks:
      - postgres_network
      - keycloak_network
      - redis_network
    user: "app:app"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - keycloak
