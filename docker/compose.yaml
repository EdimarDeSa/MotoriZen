volumes:
  motorizen_keycloak_volume:
    name: motorizen_keycloak_volume
  motorizen_keycloak_conf_volume:
    name: motorizen_keycloak_conf_volume
  motorizen_postgres_volume:
    name: motorizen_postgres_volume
  motorizen_redis_volume:
    name: motorizen_redis_volume

networks:
  motorizen_keycloak_network:
    driver: bridge
    name: motorizen_keycloak_network
  motorizen_postgres_network:
    driver: bridge
    name: motorizen_postgres_network
  motorizen_redis_network:
    driver: bridge
    name: motorizen_redis_network

services:
  postgres:
    container_name: motorizen_postgres
    image: postgres:17.4-alpine
    env_file:
      - postgres/postgres.env
    volumes:
      - ./postgres/init_sql:/docker-entrypoint-initdb.d
      - motorizen_postgres_volume:/var/lib/postgresql/data
    hostname: motorizen_postgres
    networks:
      - motorizen_postgres_network
    ports:
      - "5432:5432"
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    container_name: motorizen_redis
    image: redis:8.0-rc1-alpine3.21
    env_file:
      - redis/redis.env
    volumes:
      - motorizen_redis_volume:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/entrypoint.sh:/entrypoint.sh
    hostname: motorizen_redis
    networks:
      - motorizen_redis_network
    ports:
      - "6379:6379"
    entrypoint: ["/entrypoint.sh"]
    shm_size: 128mb
    restart: unless-stopped

  keycloak:
    container_name: motorizen_keycloak
    image: quay.io/keycloak/keycloak:26.2.0
    env_file:
      - ./keycloak/keycloak.env
    volumes:
      - motorizen_keycloak_volume:/opt/keycloak/data
      - motorizen_keycloak_conf_volume:/opt/keycloak/conf
      - ./keycloak/json_reaml_templates:/opt/keycloak/data/json_reaml_templates
      - ./keycloak/entrypoint.sh:/entrypoint.sh
    hostname: motorizen_keycloak
    networks:
      - motorizen_keycloak_network
      - motorizen_postgres_network
    ports:
      - "8080:8080"
      - "9000:9000"
    entrypoint: ["/entrypoint.sh"]
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      postgres:
        required: true
        condition: service_healthy

  motorizen_api:
    container_name: motorizen_api
    build:
      context: ..
      dockerfile: docker/api/api.dockerfile
    image: motorizen:api
    env_file:
      - api/api.env
    hostname: motorizen_api
    networks:
      - motorizen_keycloak_network
      - motorizen_postgres_network
      - motorizen_redis_network
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
    shm_size: 256mb
    restart: unless-stopped
